<!-- FIRST SEMESTER GRADING -->
<div class="semester-container">

    <div class="semester">
        <h3>MIDTERM PERIOD</h3>

        <h4>Quizzes (20 points each)</h4>
        <div id="midtermQuizzes"></div>

        <h4>Activities (30 points each)</h4>
        <div id="midtermActivities"></div>

        <label>Midterm Examination (100 points)</label>
        <input type="number" id="midtermExam"
               min="0" max="100" step="0.01" required>
    </div>

    <div class="semester">
        <h3>FINALS PERIOD</h3>

        <h4>Quizzes (20 points each)</h4>
        <div id="finalsQuizzes"></div>

        <h4>Activities (30 points each)</h4>
        <div id="finalsActivities"></div>

        <label>Final Examination (100 points)</label>
        <input type="number" id="finalsExam"
               min="0" max="100" step="0.01" required>
    </div>

</div>

<div class="first-semester-summary">
    <h3>FIRST SEMESTER SUMMARY</h3>
    <p>Midterm Period Average + Finals Period Average ÷ 2</p>
    <p>Passing Grade: 75</p>
</div>
